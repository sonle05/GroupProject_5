_format_version: "3.0"
_transform: true

services:
  # 1. Kết nối đến Module 2 (Nguyễn Phú Hòa)
  - name: order-service
    url: http://module-orders:5000
    routes:
      - name: order-route
        paths:
          - /orders
        strip_path: false

  # 2. Kết nối đến Module 3 (Nguyễn Thành Đức)
  - name: report-service
    url: http://module-control:5002
    routes:
      - name: report-route
        paths:
          - /api/report
        strip_path: false

# Cấu hình Plugins
plugins:
  - name: key-auth
    config:
      key_names: 
        - apikey
  - name: rate-limiting
    config:
      minute: 10
      policy: local

# Định nghĩa người dùng hợp lệ
consumers:
  - username: team-noah
    keyauth_credentials:
      - key: noah-secret-key