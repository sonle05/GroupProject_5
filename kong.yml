_format_version: "3.0"
_transform: true

services:
  # 1. Kết nối đến Module 2 (Nguyễn Phú Hòa)
  - name: order-service
    url: http://module-orders:5000
    routes:
      - name: order-route
        paths:
          - /orders
        strip_path: true  # Giúp Backend nhận request tại "/", tránh lỗi 404 nếu Backend không code route /orders
    plugins:
      - name: key-auth
        config: {}
      - name: rate-limiting
        config:
          minute: 10
          policy: local

  # 2. Kết nối đến Module 3 (Nguyễn Thành Đức)
  - name: report-service
    url: http://module-control:8000
    routes:
      - name: report-route
        paths:
          - /report
        strip_path: true
    plugins:
      - name: key-auth
        config: {}
      - name: rate-limiting
        config:
          minute: 10
          policy: local

# Định nghĩa Key cho người dùng
consumers:
  - username: team-noah
    keyauth_credentials:
      - key: noah-secret-key
